<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF" id="app-base">
  <script>
  (function () {
    var b = document.getElementById('app-base');
    if (!b) return;
    var host = location.hostname;
    var parts = location.pathname.split('/').filter(function (p) { return p.length; });
    if (host.indexOf('github.io') !== -1 && parts.length) {
      b.href = '/' + parts[0] + '/';
      return;
    }
    var raw = b.getAttribute('href') || '';
    if (raw.indexOf('FLUTTER_BASE_HREF') !== -1) b.href = '/';
  })();
  </script>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="코웨이 팀 주간·월간 실적과 팀원을 통합 관리합니다.">
  <meta name="theme-color" content="#0057B8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="코웨이 통합관리">
  <link rel="apple-touch-icon" href="web/icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="web/icons/Icon-192.png">
  <link rel="icon" type="image/png" href="web/favicon.png"/>
  <title>코웨이 통합관리</title>
  <style>
:root{
  --blue:#0057B8;--blue2:#0071E3;--sky:#E8F2FF;--sky2:#C5D9F5;
  --kodak:#0057B8;--kodi:#C2185B;--kodi-lt:#FCE4EC;--kodak-lt:#E3F0FF;
  --green:#2E7D32;--green2:#43A047;--amber:#E65100;--amber2:#FB8C00;
  --pink:#D81B60;--pink2:#EC407A;
  --bg:#F2F4F8;--surf:#FFFFFF;--surf2:#F8F9FC;
  --bd:#E4E8EF;--text:#111827;--text2:#6B7280;--text3:#9CA3AF;
  --r:16px;--rs:10px;--sh:0 2px 12px rgba(0,0,0,.08);
  --nav-h:68px;--top-h:56px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);}
body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--text);font-size:14px;line-height:1.5;}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:430px;margin:0 auto;background:var(--bg);overflow:hidden;}
.pages{flex:1;overflow:hidden;position:relative;}
.page{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nav-h)+16px+var(--safe-b));display:none;}
.page.active{display:block;}
.topbar{height:var(--top-h);padding:0 16px;padding-top:var(--safe-t);display:flex;align-items:center;justify-content:space-between;background:var(--blue);color:#fff;flex-shrink:0;}
.topbar-title{font-size:18px;font-weight:500;letter-spacing:-.2px;}
.topbar-sub{opacity:.72;}
.bottomnav{height:var(--nav-h);flex-shrink:0;background:var(--surf);border-top:1px solid var(--bd);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:var(--safe-b);}
.nav-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--text3);font-size:12px;font-weight:500;padding:8px 0;border:none;background:none;cursor:pointer;transition:color .15s;}
.nav-tab .ni{font-size:24px;line-height:1;transition:transform .15s;}
.nav-tab.active{color:var(--blue);font-weight:600;}
.nav-tab.active .ni{transform:scale(1.1);}
.section{padding:14px 14px 0;}
.sec-title{font-size:17px;font-weight:500;letter-spacing:-0.2px;}
.card{background:var(--surf);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-bottom:12px;}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fi{animation:up .28s ease both;}
.chip{display:inline-block;font-size:10px;padding:1px 6px;border-radius:20px;font-weight:700;vertical-align:middle;}
.chip.kodak{background:var(--kodak-lt);color:var(--kodak);}
.chip.kodi{background:var(--kodi-lt);color:var(--kodi);}
#toast{position:fixed;top:calc(var(--top-h)+12px);left:50%;transform:translateX(-50%) translateY(-8px);background:#1a1a2e;color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;font-weight:600;opacity:0;transition:all .25s;pointer-events:none;z-index:300;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ===== HERO - 수정된 색상 ===== */
.hero{background:#1e5fd4;padding:5px 14px 16px;color:#fff;}
.hero-label{font-size:11px;opacity:.85;margin-bottom:1px;color:rgba(255,255,255,.85);}
.hero-week{font-size:16px;font-weight:500;letter-spacing:-.2px;color:#fff;}
.hero-date{font-size:11px;opacity:.75;margin-top:1px;color:rgba(255,255,255,.75);}
.hero-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:6px;}
.hero-stat{background:rgba(255,255,255,.18);border-radius:8px;padding:4px 2px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.12);}
.hero-stat-val{font-size:17px;font-weight:700;line-height:1.1;color:#fff;}
.hero-stat-lbl{font-size:11px;font-weight:400;opacity:.85;margin-top:1px;color:rgba(255,255,255,.85);}
.hero-stat.total .hero-stat-val{color:#0d3fa6;font-weight:800;}
.hero-stat.total .hero-stat-lbl{color:#0d3fa6;opacity:1;font-weight:700;}
.hero-stat.total{background:rgba(255,255,255,.55);}

.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-bottom:4px;}
.kpi{background:var(--surf);border-radius:9px;padding:3px 3px;text-align:center;box-shadow:var(--sh);}
.kpi-v{font-size:16px;font-weight:600;margin-bottom:0;}
.kpi-l{font-size:11px;color:var(--text2);font-weight:500;line-height:1.2;white-space:nowrap;}
.kpi.nw .kpi-v{color:var(--blue);}
.kpi.gn .kpi-v{color:var(--green);}
.kpi.am .kpi-v{color:var(--amber);}
.kpi.pk .kpi-v{color:var(--pink);}
.rank-row{display:flex;align-items:center;gap:8px;padding:5px 12px;border-bottom:1px solid var(--bd);}
.rank-row:last-child{border-bottom:none;}
.rnk{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;}
.rnk.g{background:#FFF8E1;color:#F9A825;}
.rnk.s{background:#F5F5F5;color:#757575;}
.rnk.b{background:#FBE9E7;color:#BF360C;}
.rnk.n{background:var(--bd);color:var(--text2);}
.bm{display:flex;gap:3px;margin-top:2px;}
.bt{flex:1;height:3px;background:var(--bd);border-radius:3px;overflow:hidden;}
.bf{height:100%;border-radius:3px;}
.bf.nw{background:var(--blue);}
.bf.gn{background:var(--green);}
.bf.am{background:var(--amber);}
.bf.pk{background:var(--pink);}
.week-nav{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:var(--surf);border-bottom:1px solid var(--bd);}
.wn-btn{width:36px;height:36px;border-radius:50%;background:var(--sky);border:none;color:var(--blue);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700;}
.wn-title{font-size:18px;font-weight:700;color:var(--blue);}
.wn-date{font-size:17px;color:var(--text2);margin-top:1px;font-weight:500;}
.view-tabs{display:flex;background:var(--surf2);border-bottom:1px solid var(--bd);}
.vt{flex:1;padding:13px 0;text-align:center;font-size:16px;font-weight:500;color:var(--text3);border-bottom:2.5px solid transparent;cursor:pointer;transition:all .15s;}
.vt.active{color:var(--blue);border-bottom-color:var(--blue);background:var(--surf);font-size:17px;font-weight:600;}
.num-input{width:46px;height:32px;border:1.5px solid var(--bd);border-radius:8px;text-align:center;font-size:15px;font-weight:600;background:#fff;outline:none;-moz-appearance:textfield;}
.num-input.zero{color:#C0C4CC;font-weight:400;}
.num-input::-webkit-outer-spin-button,.num-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.num-input:focus{border-color:var(--blue);}
.num-input.nw{color:var(--blue);}
.num-input.gn{color:var(--green);}
.num-input.am{color:var(--amber);}
.num-input.pk{color:var(--pink);}
.status-wrap{padding:10px 14px 4px;}
.seg{display:flex;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:3px;gap:2px;margin-bottom:10px;}
.sb{flex:1;padding:7px 2px;border-radius:7px;border:none;background:transparent;font-size:14px;font-weight:700;color:var(--text2);cursor:pointer;transition:all .15s;}
.sb.on{background:var(--surf);box-shadow:var(--sh);}
.sb.on.c0{color:var(--blue);}
.sb.on.c1{color:var(--blue);}
.sb.on.c2{color:var(--green);}
.sb.on.c3{color:var(--amber);}
.sb.on.c4{color:var(--pink);}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--rs);box-shadow:var(--sh);margin-bottom:12px;}
.tbl-wrap::-webkit-scrollbar{height:3px;}
.tbl-wrap::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px;}
.stbl{border-collapse:collapse;background:var(--surf);font-size:12px;white-space:nowrap;width:100%;table-layout:fixed;}
.cn{position:sticky;left:0;z-index:3;background:var(--surf2);width:48px;padding:4px 2px;font-weight:600;font-size:12px;text-align:center;border-right:2px solid var(--bd);}
.stbl thead .cn{background:#EDF2FA;color:var(--text2);font-size:12px;font-weight:600;}
.cd{padding:7px 2px;font-size:12px;font-weight:600;color:var(--text2);background:#EDF2FA;text-align:center;border-bottom:1px solid var(--bd);}
.cd.tdy{background:#DDE8F8;color:var(--blue);}
.cd.wkd{color:#C62828;}
.dcel{padding:4px 2px;font-size:14px;font-weight:500;color:var(--text);text-align:center;border-bottom:1px solid var(--bd);}
.dcel.zero{color:var(--text3);font-weight:400;font-size:12px;}
.dcel.tdy{background:#F0F6FF;}
.cs{width:38px;padding:9px 2px;background:var(--sky);font-size:13px;font-weight:500;color:var(--blue);text-align:center;border-left:2px solid var(--sky2);position:sticky;right:0;z-index:3;border-bottom:1px solid var(--sky2);}
.stbl thead .cs{background:#DDE8F8;font-size:11px;font-weight:600;color:var(--blue);}
.tr-team .cn{background:#DDE8F8;font-size:12px;}
.tr-team .dcel{background:var(--sky);font-weight:600;color:var(--blue);border-top:2px solid var(--sky2);}
.tr-team .cs{background:#C5D9F5;font-size:13px;border-top:2px solid var(--sky2);}
.month-nav{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surf);border-bottom:1px solid var(--bd);}
.mn-btn{width:36px;height:36px;border-radius:50%;background:var(--sky);border:none;color:var(--blue);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700;}
.mn-title{font-size:19px;font-weight:700;color:var(--blue);}
.mkpi{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px 14px;}
.mkpi-c{background:var(--surf);border-radius:12px;padding:6px 4px;text-align:center;box-shadow:var(--sh);}
.mkpi-v{font-size:20px;font-weight:600;line-height:1.1;}
.mkpi-l{font-size:12px;color:var(--text2);font-weight:600;margin-top:2px;line-height:1.2;white-space:nowrap;}
.mkpi-c.nw .mkpi-v{color:var(--blue);}
.mkpi-c.gn .mkpi-v{color:var(--green);}
.mkpi-c.am .mkpi-v{color:var(--amber);}
.mkpi-c.pk .mkpi-v{color:var(--pink);}
.mtbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.mtbl{width:100%;border-collapse:collapse;font-size:13px;min-width:260px;}
.mtbl th{background:var(--surf2);padding:6px 6px;text-align:center;font-weight:600;font-size:13px;color:var(--text2);border-bottom:1px solid var(--bd);}
.mtbl td{padding:6px 6px;text-align:center;border-bottom:1px solid var(--bd);font-weight:500;font-size:13px;}
.mtbl tr:last-child td{border-bottom:none;}
.mtbl .ncl{text-align:center;font-weight:700;padding-left:0;white-space:nowrap;}
.mtbl .totrow td{background:var(--sky);font-weight:700;color:var(--blue);}
.mem-item{background:var(--surf);border-radius:var(--rs);box-shadow:var(--sh);margin-bottom:5px;overflow:hidden;}
.mem-top{display:flex;align-items:center;gap:8px;padding:6px 12px 3px;}
.mem-info{flex:1;min-width:0;}
.mem-name{font-size:17px;font-weight:600;line-height:1.1;}
.mem-sub{font-size:10px;font-weight:300;color:var(--text3);margin-left:6px;}
.phone-row{display:flex;align-items:center;gap:6px;padding:0 12px 6px;}
.phone-num{flex:1;font-size:17px;font-weight:400;color:#111827;letter-spacing:.6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.phone-num.empty{color:var(--text3);font-style:italic;font-weight:400;font-size:14px;letter-spacing:0;}
.edit-btn{width:30px;height:30px;border-radius:50%;background:var(--bg);border:1.5px solid var(--bd);color:var(--text2);font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.edit-btn:active{background:var(--sky);border-color:var(--blue);}
.call-btn{display:inline-flex;align-items:center;gap:4px;padding:7px 12px;background:#E6F4EA;color:#1B8C3A;border:1.5px solid #A8D5B5;border-radius:22px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none;flex-shrink:0;transition:all .15s;}
.call-btn:active{background:#1B8C3A;color:#fff;}
.call-btn.disabled{background:var(--bg);color:var(--text3);border-color:var(--bd);pointer-events:none;cursor:default;}
.del-btn{width:26px;height:26px;border-radius:50%;background:var(--bg);border:1.5px solid var(--bd);color:var(--text2);font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.del-btn:active{background:#FFEBEE;border-color:#EF9A9A;color:#C62828;}
.fab{position:fixed;bottom:80px;right:16px;width:52px;height:52px;border-radius:50%;background:var(--blue);color:#fff;font-size:26px;border:none;box-shadow:0 4px 16px rgba(0,87,184,.4);display:none;align-items:center;justify-content:center;cursor:pointer;z-index:999;}
.fab:active{transform:scale(.92);}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;opacity:0;pointer-events:none;transition:opacity .25s;}
.ov.show{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:50%;transform:translateX(-50%) translateY(110%);bottom:12px;width:92%;max-width:380px;background:var(--surf);border-radius:20px;z-index:101;transition:transform .3s cubic-bezier(.32,0,.67,0);padding-bottom:16px;}
.sheet.show{transform:translateX(-50%) translateY(0);}
.sh-handle{width:36px;height:4px;background:var(--bd);border-radius:2px;margin:12px auto 14px;}
.sh-title{font-size:16px;font-weight:700;padding:0 16px 14px;border-bottom:1px solid var(--bd);}
.sh-body{padding:16px;max-height:72vh;overflow-y:auto;}
.fl{font-size:14px;font-weight:700;color:var(--text);margin-bottom:8px;display:block;}
.finput{width:100%;padding:13px 14px;border:1.5px solid var(--bd);border-radius:10px;font-size:17px;font-family:inherit;color:var(--text);background:var(--bg);outline:none;transition:border .15s;-webkit-appearance:none;}
.finput:focus{border-color:var(--blue);background:#fff;}
.type-sel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.to{padding:8px 12px;border:2px solid var(--bd);border-radius:10px;text-align:center;cursor:pointer;transition:all .15s;}
.to.sk{border-color:var(--kodak);background:var(--kodak-lt);}
.to.si{border-color:var(--kodi);background:var(--kodi-lt);}
.to-icon{display:none;}
.to-name{font-size:17px;font-weight:700;}
.to-desc{font-size:12px;color:var(--text2);margin-top:2px;}
.btn-prim{width:100%;padding:14px;background:var(--blue);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:6px;}
.btn-prim:active{opacity:.88;}
.pwa-install-strip{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + var(--safe-b) + 10px);z-index:400;max-width:430px;margin-left:auto;margin-right:auto;background:#153a62;color:#fff;border-radius:14px;padding:11px 12px;box-shadow:0 6px 24px rgba(0,0,0,.18);font-size:13px;line-height:1.4;display:none;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.12);}
.pwa-install-strip.show{display:flex;}
.pwa-install-text{flex:1;min-width:0;margin:0;}
.btn-pwa-install{flex-shrink:0;padding:9px 14px;background:#fff;color:var(--blue);border:none;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;}
.btn-pwa-install:active{opacity:.88;}
.pwa-install-close{flex-shrink:0;width:32px;height:32px;border:none;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;}
.hbadge{display:inline-block;font-size:13px;padding:2px 5px;border-radius:4px;font-weight:700;white-space:nowrap;}
.hbadge.nw{background:#E3F0FF;color:var(--blue);}
.hbadge.gn{background:#E8F5E9;color:var(--green);}
.hbadge.am{background:#FBE9E7;color:var(--amber);}
.hbadge.pk{background:#FCE4EC;color:var(--pink);}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
input[type=number]{-moz-appearance:textfield;appearance:textfield;}
#pg-dashboard .kpi{padding:8px 3px;}
.qlinks{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.qlink{display:flex;align-items:center;gap:8px;padding:10px 10px;background:var(--surf);border-radius:12px;box-shadow:var(--sh);text-decoration:none;color:var(--text);border:1px solid var(--bd);}
.qlink:active{background:var(--sky);border-color:var(--sky2);}
.qi{width:32px;height:32px;border-radius:9px;color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.qt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2;}
.qt b{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.qt small{font-size:11px;color:var(--text3);}
.qx{width:16px;height:16px;flex-shrink:0;fill:none;stroke:var(--text3);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.qlink{font-family:inherit;text-align:left;cursor:pointer;width:100%;}
.appview{position:fixed;top:0;left:0;right:0;bottom:calc(var(--nav-h) + var(--safe-b));z-index:900;border-bottom:1px solid var(--bd);background:var(--surf);display:none;flex-direction:column;max-width:430px;margin:0 auto;}
.appview.show{display:flex;}
.av-bar{flex-shrink:0;display:flex;align-items:center;gap:6px;height:calc(52px + var(--safe-t));padding:var(--safe-t) 8px 0;background:var(--blue);color:#fff;}
.av-back{display:flex;align-items:center;gap:2px;background:none;border:none;color:#fff;font-size:14px;font-weight:600;font-family:inherit;padding:8px 6px;cursor:pointer;}
.av-back svg,.av-ext svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.av-title{flex:1;text-align:center;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.av-ext{display:flex;padding:8px;margin-right:4px;}
.av-body{flex:1;position:relative;}
.av-body iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff;}
.av-body iframe.on{display:block;}
.qlinks{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
.qlink{padding:16px 10px;min-width:0;box-sizing:border-box;gap:7px;}
.qi{width:28px;height:28px;border-radius:8px;font-size:14px;}
.qx{display:none;}
.qt b{font-size:14px;letter-spacing:-.3px;}
.qt b{font-size:15px;}
.qt small{margin-top:2px;}

<script>
let S = {
  members:[
    {id:'m01',name:'김태양',type:'kodak',phone:''},
    {id:'m02',name:'이수진',type:'kodi',phone:''},
    {id:'m03',name:'박민준',type:'kodak',phone:''},
    {id:'m04',name:'최유리',type:'kodi',phone:''},
    {id:'m05',name:'정현우',type:'kodak',phone:''},
    {id:'m06',name:'한소희',type:'kodi',phone:''},
    {id:'m07',name:'윤대한',type:'kodak',phone:''},
    {id:'m08',name:'임채원',type:'kodi',phone:''},
  ],
  records:{}
};
const today = new Date();
let curPage='dashboard';
function isoWeekYear(date){const d=new Date(date.getFullYear(),date.getMonth(),date.getDate());d.setDate(d.getDate()+3-((d.getDay()+6)%7));return d.getFullYear();}
function weeksInYear(y){return weekOfYear(new Date(y,11,28));}
/* 주간(ISO 주차 연도)과 실적월(마감 기준)을 분리해서 관리 */
const CUR_WY=isoWeekYear(today), CUR_W=weekOfYear(today);
let CUR_M={y:today.getFullYear(),mo:today.getMonth()+1};
let WY=CUR_WY, W=CUR_W;
let Y=CUR_M.y, Mo=CUR_M.mo;
let selMem=null, addType='kodi', editMemberId=null;
let wView='input', statItem='total';
const TYPES=['신규건수','정수건수','전략건수','얼정건수'];
const TYPE_META={'신규건수':{cls:'nw'},'정수건수':{cls:'gn'},'전략건수':{cls:'am'},'얼정건수':{cls:'pk'}};

const num=v=>{const n=Number(v);return isFinite(n)?n:0;};
function dayTotal(d){return TYPES.reduce((s,k)=>s+num((d||{})[k]),0);}
function sumObj(a,b){const r={};TYPES.forEach(k=>r[k]=num((a||{})[k])+num((b||{})[k]));return r;}
function zeroObj(){const r={};TYPES.forEach(k=>r[k]=0);return r;}
/* 합계 = 신규건수 + 정수건수 + 전략건수 + 얼정건수 */
function total(o){return TYPES.reduce((s,k)=>s+num((o||{})[k]),0);}

function save(){try{localStorage.setItem('coway6',JSON.stringify(S));}catch(e){}}
function load(){
  try{
    const d=localStorage.getItem('coway6');
    if(d){
      S=JSON.parse(d);
      Object.values(S.records||{}).forEach(rec=>{
        (rec.days||[]).forEach(day=>{
          if(!('신규건수' in day)){
            day.신규건수=(day.신규||0)+(day.정수기존||0);
            day.정수건수=day.정수신규||0;
            day.전략건수=(day.전략기존||0)+(day.전략신규||0);
            ['신규','정수','전략','정수기존','정수신규','전략기존','전략신규'].forEach(k=>delete day[k]);
          }
          if(!('얼정건수' in day)) day.얼정건수=0;
        });
      });
      return;
    }
  }catch(e){}
}

/* 예전 버전에서 글자('3')로 저장된 값을 숫자(3)로 정리 → 합계가 이어붙여지는 문제 방지 */
function normalizeRecords(){
  let changed=false;
  Object.values(S.records||{}).forEach(rec=>(rec.days||[]).forEach(d=>{if(!d)return;TYPES.forEach(k=>{if(typeof d[k]!=='number'){d[k]=Math.max(0,parseInt(d[k],10)||0);changed=true;}});}));
  if(changed) save();
}
function migrateWeekKeys(){
  if(!S.records) return;
  let changed=false;
  Object.keys(S.records).forEach(k=>{
    const m=k.match(/^(\d{4})-W(\d+)-(.+)$/); if(!m) return;
    const y=+m[1], w=+m[2], mid=m[3];
    if(w<=weeksInYear(y)) return;
    const nk=`${y+1}-W1-${mid}`;
    const src=S.records[k].days||[];
    const dst=S.records[nk]?S.records[nk].days:Array.from({length:7},()=>zeroObj());
    while(dst.length<7) dst.push(zeroObj());
    src.forEach((d,i)=>{TYPES.forEach(t=>{dst[i][t]=(dst[i][t]||0)+((d||{})[t]||0);});});
    S.records[nk]={days:dst}; delete S.records[k]; changed=true;
  });
  if(changed) save();
}
function weekOfYear(date){
  const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
  const dn=d.getUTCDay()||7;
  d.setUTCDate(d.getUTCDate()+4-dn);
  const y=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil((((d-y)/86400000)+1)/7);
}
/* ===== 마감일 기준 월 귀속 로직 =====
   한국 공휴일(2025~2027, 대체공휴일 포함). YYYY-MM-DD 문자열 Set. */
const HOLIDAYS=new Set([
  // 2025
  '2025-01-01','2025-01-28','2025-01-29','2025-01-30','2025-03-01','2025-03-03',
  '2025-05-05','2025-05-06','2025-06-06','2025-08-15','2025-10-03','2025-10-05',
  '2025-10-06','2025-10-07','2025-10-08','2025-10-09','2025-12-25',
  // 2026
  '2026-01-01','2026-02-16','2026-02-17','2026-02-18','2026-03-01','2026-03-02',
  '2026-05-05','2026-05-24','2026-05-25','2026-06-06','2026-08-15','2026-08-17',
  '2026-09-24','2026-09-25','2026-09-26','2026-10-03','2026-10-05','2026-10-09',
  '2026-12-25',
  // 2027
  '2027-01-01','2027-02-06','2027-02-07','2027-02-08','2027-02-09','2027-03-01',
  '2027-05-05','2027-05-13','2027-06-06','2027-08-15','2027-08-16','2027-09-14',
  '2027-09-15','2027-09-16','2027-10-03','2027-10-04','2027-10-09','2027-10-11',
  '2027-12-25'
]);
function ymd(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
/* 토·일·공휴일이면 휴일 */
function isHolidayOrWeekend(d){
  const w=d.getDay();
  if(w===0||w===6) return true;
  return HOLIDAYS.has(ymd(d));
}
/* 해당 (y,mo)의 마감일: 말일의 달력상 2일 전 → 휴일이면 앞 평일로 당김 */
function monthCutoff(y,mo){
  const last=new Date(y,mo,0);            // 그 달 말일
  const d=new Date(y,mo-1,last.getDate()-2); // 달력상 2일 전
  while(isHolidayOrWeekend(d)) d.setDate(d.getDate()-1); // 휴일이면 앞 평일로
  return d;
}
/* 특정 날짜 dt가 귀속되는 실적월 {y,mo} 반환.
   규칙: (전월 마감일 다음날) ~ (당월 마감일) 사이 → 당월.
   즉 dt가 당월 마감일 이하이면 당월, 초과하면 익월. */
function recMonthOf(dt){
  let y=dt.getFullYear(), mo=dt.getMonth()+1;
  const cut=monthCutoff(y,mo);
  if(dt.getTime()<=cut.getTime()){
    return {y,mo};                        // 당월 마감일 이내 → 당월
  }else{
    let ny=y, nmo=mo+1; if(nmo>12){nmo=1;ny++;}
    return {y:ny,mo:nmo};                 // 마감일 넘김 → 익월
  }
}
function weekDates(year,week){
  const j=new Date(year,0,4);
  const start=new Date(j.setDate(j.getDate()-(j.getDay()||7)+1));
  start.setDate(start.getDate()+(week-1)*7);
  return Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);return d;});
}
const DAYS=['월','화','수','목','금','토','일'];
function fmt(d){return `${d.getMonth()+1}/${d.getDate()}`;}
function fullDate(d){return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;}
function isToday(d){return fullDate(d)===fullDate(today);}

function rk(y,w,mid){return `${y}-W${w}-${mid}`;}
function getRec(y,w,mid){
  const r=S.records[rk(y,w,mid)];
  if(r){while(r.days.length<7)r.days.push(zeroObj());return r;}
  return{days:Array.from({length:7},()=>zeroObj())};
}
function setRec(y,w,mid,days){S.records[rk(y,w,mid)]={days};save();}
function wSum(y,w,mid){return getRec(y,w,mid).days.reduce((a,d)=>sumObj(a,d),zeroObj());}
function mSum(y,mo,mid){
  const t=zeroObj();
  /* 대상 실적월(y,mo)의 데이터는 (전월 마감일+1)~(당월 마감일) 구간에 실제 입력됨.
     그 구간은 달력상 전월 말경~당월 말경에 걸치므로, 전월 W주차부터 당월 W주차까지 스캔. */
  for(let dy=y-1;dy<=y+1;dy++){
    const nw=weeksInYear(dy);
    for(let w=1;w<=nw;w++){
      const ds=weekDates(dy,w);
      /* 이 주의 날짜들이 대상월 귀속 구간과 전혀 무관하면 스킵 (성능) */
      const anyRelevant=ds.some(d=>{
        const rm=recMonthOf(d);
        return rm.y===y&&rm.mo===mo;
      });
      if(!anyRelevant) continue;
      const rec=S.records[rk(dy,w,mid)];
      if(!rec) continue;
      const days=rec.days||[];
      ds.forEach((dt,i)=>{
        const rm=recMonthOf(dt);
        if(rm.y===y&&rm.mo===mo){
          const d=days[i]||zeroObj();
          TYPES.forEach(k=>t[k]+=num(d[k]));
        }
      });
    }
  }
  return t;
}
function twSum(y,w){return S.members.reduce((a,m)=>sumObj(a,wSum(y,w,m.id)),zeroObj());}
function tmSum(y,mo){return S.members.reduce((a,m)=>sumObj(a,mSum(y,mo,m.id)),zeroObj());}

function formatPhone(phone){
  if(!phone)return'';
  const num=String(phone).replace(/[^0-9]/g,'');
  if(num.length===11)return num.replace(/(\d{3})(\d{4})(\d{4})/,'$1-$2-$3');
  if(num.length===10)return num.replace(/(\d{3})(\d{3})(\d{4})/,'$1-$2-$3');
  return phone;
}
function normalizePhoneInput(value){
  const num=String(value||'').replace(/[^0-9]/g,'').slice(0,11);
  if(num.length<4)return num;
  if(num.length<8)return num.replace(/(\d{3})(\d+)/,'$1-$2');
  return num.replace(/(\d{3})(\d{3,4})(\d+)/,'$1-$2-$3');
}

const renders={dashboard:renderDash,rank:renderRank,weekly:renderWeekly,monthly:renderMonthly,members:renderMembers};
function goPage(page,btn){
  if(typeof curApp!=='undefined'&&curApp) closeApp();
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('pg-'+page).classList.add('active');
  if(btn)btn.classList.add('active');
  curPage=page;
  document.getElementById('fab').style.display=page==='members'?'flex':'none';
  renders[page]();
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}
function openSheet(id){document.getElementById('ov').classList.add('show');document.getElementById(id).classList.add('show');}
function closeSheet(){document.getElementById('ov').classList.remove('show');['sh-add','sh-member'].forEach(id=>document.getElementById(id).classList.remove('show'));}
function selType(t){
  addType=t;
  document.getElementById('to-kodak').className='to'+(t==='kodak'?' sk':'');
  document.getElementById('to-kodi').className='to'+(t==='kodi'?' si':'');
}
function openAddSheet(){document.getElementById('inp-name').value='';document.getElementById('inp-phone').value='';selType('kodi');openSheet('sh-add');}
function selEditType(t){
  const k=document.getElementById('edit-to-kodak');
  const i=document.getElementById('edit-to-kodi');
  if(!k||!i)return;
  k.className='to'+(t==='kodak'?' sk':'');
  i.className='to'+(t==='kodi'?' si':'');
  const m=S.members.find(x=>x.id===editMemberId);
  if(m)m._editType=t;
}
function openEditMember(id){
  editMemberId=id;
  const m=S.members.find(x=>x.id===id);
  if(!m)return;
  document.getElementById('sh-member-title').textContent=`${m.name} - 팀원 정보 수정`;
  document.getElementById('inp-member-name-edit').value=m.name;
  document.getElementById('inp-member-phone-edit').value=formatPhone(m.phone||'');
  m._editType=m.type;selEditType(m.type);openSheet('sh-member');
}
function saveMemberInfo(){
  if(!editMemberId)return;
  const m=S.members.find(x=>x.id===editMemberId);
  if(!m)return;
  const newName=document.getElementById('inp-member-name-edit').value.trim();

/* ===== 관리계정 ===== */
function getMgRec(y,mo,mid){
  if(!S.manage) S.manage={};
  if(!S.manage[y]) S.manage[y]={};
  if(!S.manage[y][mo]) S.manage[y][mo]={};
  if(!S.manage[y][mo][mid]) S.manage[y][mo][mid]={건수:0,재렌탈:0};
  return S.manage[y][mo][mid];
}
function mgRate(g,r){
  if(!g||g===0) return '-';
  return Math.round(r/g*100)+'';
}
function mgRate1(g,r){
  if(!g||g===0) return '-';
  return (r/g*100).toFixed(1)+'%';
}
/* 7개월: 현재달=참고, +1~+6=합산 */
/* 소유권 기준 시작월: 저장값(S.mgBase) 우선, 없으면 오늘 기준.
   시작월(mo)만 저장하고, 연도는 오늘 기준으로 가장 가까운 해로 자동 보정 */
function getMgBase(){
  if(S.mgBase && S.mgBase.mo){
    const mo=S.mgBase.mo;
    let y=(S.mgBase.y)|| CUR_M.y;
    return {y, mo};
  }
  return {y:CUR_M.y, mo:CUR_M.mo};
}
function setMgBaseMonth(mo){
  mo=parseInt(mo,10); if(!mo||mo<1||mo>12) return;
  /* 선택한 시작월에 대해 오늘과 가장 가까운 연도 자동 결정 */
  let y=CUR_M.y;
  const diff=mo-CUR_M.mo;
  if(diff>6) y=CUR_M.y-1;        /* 시작월이 한참 앞이면 작년으로 */
  else if(diff<-6) y=CUR_M.y+1;  /* 시작월이 한참 뒤면 내년으로 */
  S.mgBase={y, mo};
  save(); renderWeekly();
}
function getMgMonths(baseY,baseMo){
  const months=[];
  for(let i=0;i<=6;i++){
    let mo=baseMo+i,y=baseY;
    if(mo>12){mo-=12;y++;}
    months.push({y,mo,ref:(i===0)});
  }
  return months;
}
function setMgVal(y,mo,mid,field,value){
  getMgRec(y,mo,mid)[field]=value===''?0:Math.max(0,parseInt(value,10)||0);
  save();
  refreshMgShort();
  /* 해당 셀 % 갱신 */
  const r=getMgRec(y,mo,mid);
  const rateEl=document.getElementById('mg-rate-'+y+'-'+mo+'-'+mid);
  if(rateEl) rateEl.textContent=mgRate(r.건수||0,r.재렌탈||0);
  /* 해당 월 팀합계 갱신 */
  let tG=0,tR=0;
  S.members.forEach(m=>{const rec=getMgRec(y,mo,m.id);tG+=rec.건수||0;tR+=rec.재렌탈||0;});
  const tgEl=document.getElementById('mg-team-g-'+y+'-'+mo);
  const trEl=document.getElementById('mg-team-r-'+y+'-'+mo);
  const tpEl=document.getElementById('mg-team-rate-'+y+'-'+mo);
  if(tgEl) tgEl.textContent=tG;
  if(trEl) trEl.textContent=tR;
  if(tpEl) tpEl.textContent=mgRate(tG,tR);
  /* 멤버 합산(참고월 제외) */
  const baseY2=parseInt(document.getElementById('mg-base-y')?.value||getMgBase().y);
  const baseMo2=parseInt(document.getElementById('mg-base-mo')?.value||getMgBase().mo);
  const sumMonths=getMgMonths(baseY2,baseMo2).filter(x=>!x.ref);
  let mG=0,mR=0;
  sumMonths.forEach(({y:my,mo:mm})=>{const rec=getMgRec(my,mm,mid);mG+=rec.건수||0;mR+=rec.재렌탈||0;});
  const sg=document.getElementById('mg-sum-g-'+mid);
  const sr=document.getElementById('mg-sum-r-'+mid);
  const sp=document.getElementById('mg-sum-p-'+mid);
  if(sg) sg.textContent=mG; if(sr) sr.textContent=mR; if(sp) sp.textContent=mgRate(mG,mR);
  /* 팀 합산 */
  let ttG=0,ttR=0;
  sumMonths.forEach(({y:my,mo:mm})=>{S.members.forEach(m=>{const rec=getMgRec(my,mm,m.id);ttG+=rec.건수||0;ttR+=rec.재렌탈||0;});});
  const tsg=document.getElementById('mg-team-sum-g');const tsr=document.getElementById('mg-team-sum-r');const tsp=document.getElementById('mg-team-sum-p');
  if(tsg) tsg.textContent=ttG; if(tsr) tsr.textContent=ttR; if(tsp) tsp.textContent=mgRate(ttG,ttR);
  const kG=document.getElementById('mg-kpi-g');const kR=document.getElementById('mg-kpi-r');const kP=document.getElementById('mg-kpi-p');
  if(kG) kG.textContent=ttG; if(kR) kR.textContent=ttR; if(kP) kP.textContent=mgRate1(ttG,ttR);
  /* 달성률 갱신: 이번달 신규+정수+전략 합계 기준 */
  const mtNow=tmSum(CUR_M.y,CUR_M.mo);
  const actual=total(mtNow);
  const actualEl=document.getElementById('mg-achieve-actual');
  if(actualEl) actualEl.textContent=actual;
  if(S.mgGoal){
    const rate=(actual/S.mgGoal*100);
    const rateEl=document.getElementById('mg-achieve-rate');
    const barEl=document.getElementById('mg-achieve-bar');
    if(rateEl){rateEl.textContent=rate.toFixed(2)+'%';rateEl.style.color=actual>=S.mgGoal?'var(--green)':'var(--amber)';}
    if(barEl) barEl.style.width=Math.min(rate,100).toFixed(2)+'%';
  }
}

function setMgRateTarget(value){
  const parsed=parseInt(value,10);
  if(isNaN(parsed)||parsed<=0) return;
  S.mgRateTarget=parsed;
  save();
  refreshMgShort();
}
function refreshMgShort(){
  /* 부족 칸만 DOM 직접 업데이트 */
  const rate=(S.mgRateTarget||55)/100;
  S.members.forEach(m=>{
    const baseY2=parseInt(document.getElementById('mg-base-y')?.value||getMgBase().y);
    const baseMo2=parseInt(document.getElementById('mg-base-mo')?.value||getMgBase().mo);
    const sumMs=getMgMonths(baseY2,baseMo2).filter(x=>!x.ref);
    let mG=0,mR=0;
    sumMs.forEach(({y:my,mo:mm})=>{const r=getMgRec(my,mm,m.id);mG+=r.건수||0;mR+=r.재렌탈||0;});
    const short=Math.round(mG*rate)-mR;
    const el=document.getElementById('mg-sum-short-'+m.id);
    if(el){el.textContent=short<=0?'-':'-'+short;el.style.color=short<=0?'var(--text3)':'#C62828';}

  /* 팀합계 부족 업데이트 */

  const baseMo3=parseInt(document.getElementById('mg-base-mo')?.value||getMgBase().mo);

  S.members.forEach(m=>{
    let mG=0,mR=0;
    sumMs2.forEach(({y:my,mo:mm})=>{const r=getMgRec(my,mm,m.id);mG+=r.건수||0;mR+=r.재렌탈||0;});

function setMgGoal(value){
  S.mgGoal=value===''?0:Math.max(0,parseInt(value,10)||0);
  save();
  /* 목표 표시 */
  const gd=document.getElementById('mg-goal-disp');
  if(gd) gd.textContent=S.mgGoal?S.mgGoal.toLocaleString():'-';
  /* 실적: 이번달 신규+정수+전략 합계 */
  const mt=tmSum(CUR_M.y,CUR_M.mo);
  const actual=total(mt);
  const actualEl=document.getElementById('mg-achieve-actual');
  if(actualEl) actualEl.textContent=actual;
  /* 달성률 */
  const rate=S.mgGoal?(actual/S.mgGoal*100):0;
  const rateEl=document.getElementById('mg-achieve-rate');
  const barEl=document.getElementById('mg-achieve-bar');
  const boxEl=rateEl?.parentElement;
  if(rateEl) rateEl.textContent=S.mgGoal?rate.toFixed(2)+'%':'-';
  if(rateEl) rateEl.style.color=S.mgGoal&&actual>=S.mgGoal?'var(--green)':'var(--amber)';
  if(boxEl) boxEl.style.background=S.mgGoal&&actual>=S.mgGoal?'#E8F5E9':'#FFF8E1';
  if(barEl) barEl.style.width=S.mgGoal?Math.min(rate,100).toFixed(2)+'%':'0%';
  const dar=document.getElementById('dash-achieve-rate');
  if(dar) dar.textContent=S.mgGoal?rate.toFixed(2)+'%':'-';
}

function handleFocus(el){el.classList.remove('zero');el.placeholder='';if(el.value==='0')el.value='';}
function handleBlur(el,mid,di,type){
  if(el.value===''){
    el.classList.add('zero');el.placeholder='0';
    const rec=getRec(WY,W,mid);rec.days[di][type]=0;setRec(WY,W,mid,rec.days);refreshInputTotals(mid);
  }else{el.placeholder='0';}
}
function setDayValue(mid,di,type,value){
  const rec=getRec(WY,W,mid);
  rec.days[di][type]=value===''?0:Math.max(0,parseInt(value,10)||0);
  setRec(WY,W,mid,rec.days);
  refreshInputTotals(mid);
}
function refreshInputTotals(mid){
  const rt=document.getElementById('wsi-tot-'+mid);
  if(rt){const v=total(wSum(WY,W,mid));rt.textContent=v||'';}
  for(let di=0;di<7;di++){

    let v=0; S.members.forEach(m=>{v+=dayTotal(getRec(WY,W,m.id).days[di]||zeroObj());});
    el.textContent=v||0;

}

function addMember(){

function delMember(id){
  const m=S.members.find(x=>x.id===id);
  if(!m)return;
  if(!confirm(`"${m.name}" 팀원을 삭제하시겠습니까?\n실적 데이터도 함께 삭제됩니다.`))return;
  S.members=S.members.filter(x=>x.id!==id);
  Object.keys(S.records).forEach(k=>{if(k.endsWith('-'+id))delete S.records[k];});
  save();
  if(selMem===id)selMem=S.members[0]?.id||null;
  renders[curPage]&&renders[curPage]();toast(`${m.name} 팀원이 삭제되었습니다`);
}

/* ===== 함께 쓰는 앱: 통합관리 안에서 실행 ===== */
const APPS={
  manager:{title:'점프UP 매니저',src:'src-manager'},
  cody:{title:'점프UP 코디',src:'src-cody'}
};
function appSource(id){return document.getElementById(id).textContent.replace(/^\n/,'').replace(/<\\\/script/g,'</script').replace(/<\\!--/g,'<!--');}
let curApp=null;
function openApp(key){
  const a=APPS[key]; if(!a) return;
  const body=document.getElementById('av-body');
  let fr=document.getElementById('av-fr-'+key);
  if(!fr){
    fr=document.createElement('iframe');
    fr.id='av-fr-'+key; fr.title=a.title; fr.srcdoc=appSource(a.src);
    fr.setAttribute('allow','clipboard-write; fullscreen');
    body.appendChild(fr);
  }
  body.querySelectorAll('iframe').forEach(x=>x.classList.toggle('on',x===fr));
  document.getElementById('av-title').textContent=a.title;
  const v=document.getElementById('appview'); v.classList.add('show'); v.setAttribute('aria-hidden','false');
  if(!curApp){try{history.pushState({app:key},'');}catch(e){}}
  curApp=key;
}
function hideApp(){
  const v=document.getElementById('appview'); v.classList.remove('show'); v.setAttribute('aria-hidden','true');
  curApp=null;
}
function closeApp(){
  if(curApp && history.state && history.state.app){history.back();}else{hideApp();}
}
window.addEventListener('popstate',()=>{if(curApp) hideApp();});
/* 단독 앱(jumpup-app / cody-jump-up)에서 데이터가 바뀌면 통합관리 안의 앱도 최신으로 */
window.addEventListener('storage',e=>{
  if(!e.key||e.key.indexOf('jump_')!==0) return;
  if(!/\/(jumpup-app|cody-jump-up)\//.test(e.url||'')) return; /* 통합관리 안에서 바꾼 건 무시 */
  Object.keys(APPS).forEach(k=>{
    const fr=document.getElementById('av-fr-'+k); if(!fr) return;
    if(curApp===k) fr.srcdoc=appSource(APPS[k].src); else fr.remove();
  });
});


/* ===== 팀순위 SNS 공유 ===== */
function rankData(){
  const y=CUR_M.y, mo=CUR_M.mo;
  const ranked=[...S.members].map(m=>{const s=mSum(y,mo,m.id);return{...m,...s,total:total(s)};}).sort((a,b)=>b.total-a.total);
  const pc=monthCutoff(mo===1?y-1:y,mo===1?12:mo-1), cc=monthCutoff(y,mo); const st=new Date(pc); st.setDate(st.getDate()+1);
  return {y,mo,ranked,range:`${st.getMonth()+1}/${st.getDate()} ~ ${cc.getMonth()+1}/${cc.getDate()}`,team:tmSum(y,mo)};
}
function rankText(){
  const d=rankData(), md=['🥇','🥈','🥉'];
  const lines=[`🏆 코웨이 팀원 순위 ${d.y}.${String(d.mo).padStart(2,'0')}`,`(집계 ${d.range})`,''];
  d.ranked.forEach((m,i)=>lines.push(`${i<3?md[i]:(i+1)+'위'} ${m.name}  ${m.total}건  (신규 ${m.신규건수} · 정수 ${m.정수건수} · 전략 ${m.전략건수} · 얼정 ${m.얼정건수})`));
  lines.push('',`팀 합계 ${total(d.team)}건 (신규 ${d.team.신규건수} · 정수 ${d.team.정수건수} · 전략 ${d.team.전략건수} · 얼정 ${d.team.얼정건수})`);
  return lines.join('\n');
}
async function shareRankText(){
  const text=rankText();
  if(navigator.share){try{await navigator.share({title:'코웨이 팀원 순위',text});return;}catch(e){if(e&&e.name==='AbortError')return;}}
  try{await navigator.clipboard.writeText(text);toast('순위를 복사했습니다. 카톡·문자에 붙여넣기 하세요');return;}catch(e){}
  showShareView(`<textarea readonly>${text.replace(/</g,'&lt;')}</textarea>`,'길게 눌러 전체 선택 후 복사하세요');
}
function drawRankCanvas(){
  const d=rankData(), W=1080, P=56, rowH=128, headH=250, footH=150;
  const H=headH+d.ranked.length*rowH+footH+P;
  const c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');
  const F="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif";
  g.fillStyle='#F2F4F8'; g.fillRect(0,0,W,H);
  g.fillStyle='#1e5fd4'; g.fillRect(0,0,W,headH);
  g.fillStyle='#fff'; g.font=`600 58px ${F}`; g.textBaseline='alphabetic';
  g.fillText('이번 달 팀원 순위',P,118);
  g.font=`400 36px ${F}`; g.fillStyle='rgba(255,255,255,.85)';
  g.fillText(`${d.y}.${String(d.mo).padStart(2,'0')}  ·  집계 ${d.range}`,P,178);
  const cy=headH+24, cw=W-P*2, ch=d.ranked.length*rowH;
  g.fillStyle='#fff'; rr(g,P,cy,cw,ch,28); g.fill();
  const medal=[['#FFF8E1','#F9A825'],['#F1F3F6','#757575'],['#FBE9E7','#BF360C']];
  const TC=[['신규건수','신규','#0057B8'],['정수건수','정수','#2E7D32'],['전략건수','전략','#E65100'],['얼정건수','얼정','#D81B60']];
  const mx=d.ranked[0]?.total||1;
  d.ranked.forEach((m,i)=>{
    const y0=cy+i*rowH;
    if(i>0){g.fillStyle='#E4E8EF';g.fillRect(P+28,y0,cw-56,2);}
    const [bg,fg]=medal[i]||['#E4E8EF','#6B7280'];
    g.fillStyle=bg; g.beginPath(); g.arc(P+64,y0+rowH/2,30,0,Math.PI*2); g.fill();
    g.fillStyle=fg; g.font=`700 30px ${F}`; g.textAlign='center'; g.fillText(String(i+1),P+64,y0+rowH/2+11); g.textAlign='left';
    g.fillStyle='#111827'; g.font=`600 40px ${F}`; g.fillText(m.name,P+118,y0+56);
    g.font=`400 29px ${F}`; let x=P+118;
    TC.forEach(([k,l,col],j)=>{const t=`${l} ${m[k]}`; g.fillStyle=col; g.fillText(t,x,y0+100); x+=g.measureText(t).width+(j<3?30:0);});
    const bx=P+430, bw=cw-430-150;
    g.fillStyle='#EEF1F5'; rr(g,bx,y0+42,bw,14,7); g.fill();
    g.fillStyle='#1e5fd4'; if(m.total>0){rr(g,bx,y0+42,Math.max(14,bw*m.total/mx),14,7); g.fill();}
    g.fillStyle='#0057B8'; g.font=`700 50px ${F}`; g.textAlign='right'; g.fillText(String(m.total),P+cw-72,y0+rowH/2+18);
    g.font=`500 26px ${F}`; g.fillStyle='#6B7280'; g.fillText('건',P+cw-34,y0+rowH/2+18); g.textAlign='left';
  });
  const fy=cy+ch+30;
  g.fillStyle='#E8F2FF'; rr(g,P,fy,cw,96,24); g.fill();
  g.fillStyle='#0057B8'; g.font=`600 36px ${F}`; g.fillText('팀 합계',P+36,fy+61);
  g.textAlign='right'; g.font=`700 44px ${F}`; g.fillText(`${total(d.team)}건`,P+cw-36,fy+63); g.textAlign='left';
  g.font=`400 28px ${F}`; g.fillStyle='#6B7280';
  g.fillText(`신규 ${d.team.신규건수} · 정수 ${d.team.정수건수} · 전략 ${d.team.전략건수} · 얼정 ${d.team.얼정건수}`,P+200,fy+60);
  return c;
  function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
}

/* ===== 전체 데이터 백업 · 복구 ===== */
const BK_APP='coway-integrated';
function bkKeys(){
  const ks=[];
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k==='coway6'||(k&&k.indexOf('jump_')===0))ks.push(k);}
  return ks.sort();
}
function bkStamp(d){const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function buildBackup(){
  const now=new Date(); S.lastBackup=bkStamp(now); save();
  const data={}; bkKeys().forEach(k=>{data[k]=localStorage.getItem(k);});
  return {app:BK_APP,version:1,createdAt:now.toISOString(),data};
}
async function backupAll(){
  const b=buildBackup(), json=JSON.stringify(b);
  const d=new Date(b.createdAt), p=n=>String(n).padStart(2,'0');
  const name=`코웨이통합관리_백업_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.json`;
  const file=new File([json],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:'코웨이 통합관리 백업'});toast('백업 파일을 저장했습니다');renderMembers();return;}
    catch(e){if(e&&e.name==='AbortError'){return;}}
  }
  try{
    const url=URL.createObjectURL(file);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  }catch(e){}
  try{await navigator.clipboard.writeText(json);}catch(e){}
  renderMembers();
  showShareView(`<textarea readonly onclick="this.select()">${json.replace(/</g,'&lt;')}</textarea>`,'백업 파일이 내려받아지지 않았다면, 위 내용을 전체 복사해 메모·카톡 나에게 보내기 등에 보관하세요');
}
function summarizeBackup(b){
  let members=0,weeks=0;
  try{const c=JSON.parse(b.data.coway6||'{}');members=(c.members||[]).length;weeks=Object.keys(c.records||{}).length;}catch(e){}
  const has=k=>Object.prototype.hasOwnProperty.call(b.data,k);
  return `백업 시각: ${bkStamp(new Date(b.createdAt))}\n· 통합관리: 팀원 ${members}명, 주간 기록 ${weeks}건\n· 점프UP 매니저: ${has('jump_db')||has('jump_members')?'있음':'없음'}\n· 점프UP 코디: ${has('jump_cody_v3')?'있음':'없음'}`;
}
function applyBackup(text){
  let b;
  try{b=JSON.parse(text);}catch(e){toast('백업 파일 형식이 올바르지 않습니다');return;}
  if(!b||b.app!==BK_APP||!b.data||typeof b.data!=='object'){toast('코웨이 통합관리 백업 파일이 아닙니다');return;}
  if(!confirm('이 백업으로 모든 데이터를 되돌립니다.\n지금 앱에 있는 데이터는 백업 내용으로 바뀝니다.\n\n'+summarizeBackup(b)+'\n\n복구할까요?')) return;
  try{
    bkKeys().forEach(k=>{if(!(k in b.data))localStorage.removeItem(k);});
    Object.entries(b.data).forEach(([k,v])=>{if(k==='coway6'||k.indexOf('jump_')===0)localStorage.setItem(k,String(v));});
  }catch(e){toast('복구 중 저장 공간 오류가 발생했습니다');return;}
  toast('복구했습니다. 다시 불러옵니다');
  setTimeout(()=>location.reload(),700);
}
function restoreFromFile(inp){
  const f=inp.files&&inp.files[0]; inp.value=''; if(!f) return;
  const r=new FileReader(); r.onload=()=>applyBackup(String(r.result)); r.onerror=()=>toast('파일을 읽지 못했습니다'); r.readAsText(f);
}
function openRestoreText(){
  showShareView('<textarea id="bk-paste" placeholder="복사해 둔 백업 내용을 여기에 붙여넣으세요"></textarea>','붙여넣은 뒤 아래 [이 내용으로 복구]를 누르세요');

  btn.onclick=()=>{const t=document.getElementById('bk-paste').value.trim();if(!t)return toast('붙여넣은 내용이 없습니다');closeShareView();btn.remove();applyBackup(t);};
  m.after(btn);
  const close=document.querySelector('#shv .shv-close');const old=close.onclick;close.onclick=()=>{btn.remove();closeShareView();close.onclick=old;};
}

let pwaDeferredPrompt=null;
function isPwaStandalone(){return window.matchMedia('(display-mode: standalone)').matches||window.matchMedia('(display-mode: window-controls-overlay)').matches||window.navigator.standalone===true;}
function setupPwaInstallUi(){
  if(isPwaStandalone())return;
  const strip=document.getElementById('pwa-install-strip');
  const btn=document.getElementById('pwa-install-btn');
  const msg=document.getElementById('pwa-install-msg');
  const dismiss=document.getElementById('pwa-install-dismiss');
  if(!strip||!msg||!dismiss)return;
  const ua=navigator.userAgent||'';
  const dismissed=sessionStorage.getItem('pwaInstallDismissed')==='1';
  const isIOS=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const isHttpLan=location.protocol==='http:'&&location.hostname!=='localhost'&&location.hostname!=='127.0.0.1';
  function showStrip(text,showBtn){if(dismissed)return;msg.textContent=text;btn.hidden=!showBtn;strip.classList.add('show');}
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();pwaDeferredPrompt=e;showStrip('홈 화면에 추가하면 앱처럼 바로 실행할 수 있습니다.',true);});
  if(btn){btn.addEventListener('click',async function(){if(!pwaDeferredPrompt)return;pwaDeferredPrompt.prompt();await pwaDeferredPrompt.userChoice;pwaDeferredPrompt=null;strip.classList.remove('show');});}
  dismiss.addEventListener('click',function(){strip.classList.remove('show');sessionStorage.setItem('pwaInstallDismissed','1');});
  if(dismissed)return;
  if(isIOS&&!isPwaStandalone()){
    if(/CriOS|FxiOS|EdgiOS/.test(ua)){showStrip('브라우저 메뉴(⋮)에서 "홈 화면에 추가" 또는 "앱 설치"를 선택하세요.',false);}

    return;
  }
  if(isHttpLan&&/Mobile|Android|iPhone/i.test(ua)){showStrip('이 주소(http)에서는 자동 설치가 제한될 수 있습니다.',false);}
}

<script>
/* ── 오늘 날짜 ── */
(function(){
  const d=new Date();
  const s=d.getFullYear()+'.'+(d.getMonth()+1).toString().padStart(2,'0')+'.'+d.getDate().toString().padStart(2,'0');
  document.getElementById('today-date').textContent=s;
})();

/* ── iOS 자동 줌 방지 ── */
(function(){
  function disableZoom(){
    const m=document.querySelector('meta[name=viewport]');
    if(m) m.content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no';
  }
  document.addEventListener('touchstart',disableZoom,{passive:true});
})();

/* ═══════════════════════════════════════════════════
   localStorage 키
═══════════════════════════════════════════════════ */
const LS_MEMBERS = 'jump_members';
const LS_DB      = 'jump_db';
const LS_THR     = 'jump_thr';

/* ── 기본 데이터 ── */
const DEFAULT_MEMBERS = ['박행신','강승임','박일녀','임병순','김태효','전숙경','이은이','우영미'];
const DEFAULT_DB = [
  {mgmt:236,n:4,r:6,s:0},{mgmt:250,n:10,r:2,s:0},{mgmt:283,n:17,r:15,s:0},
  {mgmt:239,n:0,r:5,s:0},{mgmt:234,n:0,r:3,s:0},{mgmt:228,n:10,r:6,s:0},
  {mgmt:146,n:7,r:2,s:0},{mgmt:275,n:13,r:7,s:0}
];

/* ── localStorage에서 불러오기 ── */
function loadData(){
  try {
    const m = localStorage.getItem(LS_MEMBERS);
    const d = localStorage.getItem(LS_DB);
    const t = localStorage.getItem(LS_THR);
    members = m ? JSON.parse(m) : DEFAULT_MEMBERS.slice();
    dbData  = d ? JSON.parse(d) : DEFAULT_DB.map(x=>Object.assign({},x));
    // 부족기준 불러오기
    if(t !== null){
      document.getElementById('thr-sy').value = t;
    } else {
      document.getElementById('thr-sy').value = 7;
    }
    // 멤버 수만큼 db 맞추기
    while(dbData.length < members.length) dbData.push(mkD());
  } catch(e){
    members = DEFAULT_MEMBERS.slice();
    dbData  = DEFAULT_DB.map(x=>Object.assign({},x));
  }
}

/* ── localStorage에 저장 ── */
function saveData(){
  try {
    localStorage.setItem(LS_MEMBERS, JSON.stringify(members));
    localStorage.setItem(LS_DB,      JSON.stringify(dbData));
    localStorage.setItem(LS_THR,     document.getElementById('thr-sy').value);
    showToast();
  } catch(e){
    console.warn('localStorage 저장 실패:', e);
  }
}

/* ── 토스트 알림 ── */
function showToast(){
  const t=document.getElementById('toast');
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 1500);
}

/* ── 변수 선언 ── */
let members = [];
let dbData  = [];

function mkD(){ return {mgmt:0,n:0,r:0,s:0}; }
function safeInt(v){ const n=parseInt(v,10); return (isNaN(n)||n<0)?0:n; }

/* ── 계산 ── */
function calcHW(n,r,s){ return n + r*0.5 + s; }
function calcSY(mgmt,n,r,s){ return mgmt ? calcHW(n,r,s)/mgmt*100 : 0; }
function getSYLv(sy){ return sy>=7?3 : sy>=5?2 : sy>=3?1 : 0; }
function getSYBonus(hw,syLv){ if(hw<7) return 0; return {1:2.0,2:3.5,3:4.5}[syLv]||0; }
function p369Price(h){ if(h>=20)return 5; if(h>=15)return 4.5; if(h>=11)return 3.9; if(h>=7)return 3.3; if(h>=4)return 2.7; return 0; }

/* ── debounce ── */
let _syTimer=null;
function debounceSY(){ clearTimeout(_syTimer); _syTimer=setTimeout(updateSYResults,300); }

/* ── DB 업데이트: 입력 즉시 저장 ── */
let _lastUpd={};
function updDB(i, field, val, tab){
  const key=i+'-'+field+'-'+tab;
  const v=safeInt(val);
  if(_lastUpd[key]===v) return;
  _lastUpd[key]=v;
  if(!dbData[i]) dbData[i]=mkD();
  dbData[i][field]=v;
  /* ★ 핵심: 숫자 입력할 때마다 localStorage에 저장 */
  try { localStorage.setItem(LS_DB, JSON.stringify(dbData)); } catch(e){}
  tab==='sy' ? updateSYResults() : update369Results();
}

/* ── 생산율 결과 갱신 ── */
function updateSYResults(){
  const thr = safeInt(document.getElementById('thr-sy').value) || 3;
  /* 부족기준도 즉시 저장 */
  try { localStorage.setItem(LS_THR, document.getElementById('thr-sy').value); } catch(e){}

  let tN=0,tR=0,tS=0,tM=0,tPay=0;
  members.forEach(function(_,i){
    const d=dbData[i];
    if(!d) return;
    const mgmt=d.mgmt||0, n=d.n||0, r=d.r||0, s=d.s||0;
    const hw=calcHW(n,r,s), sy=calcSY(mgmt,n,r,s), syLv=getSYLv(sy);
    tN+=n; tR+=r; tS+=s; tM+=mgmt;
    const hasInput=(n||r||s);

    let syTx='-', syCl='dash';
    if(mgmt && hasInput){ syTx=sy.toFixed(2)+'%'; syCl=syLv>=3?'pg':syLv>=2?'nb':syLv>=1?'pw':'gneg'; }

    let hwTx='-', hwCl='dash';
    if(hasInput){ hwTx=hw.toFixed(1); hwCl='nb'; }

    let gTx='-', gCl='dash';
    if(mgmt && hasInput){
      // 목표계정수 = ceil(관리계정 × thr%), 부족건수 = 목표계정수 - 환산건수
      const targetHW = Math.ceil(mgmt * (thr/100));
      const diff = targetHW - hw;
      if(diff <= 0){ gTx='+'+Math.abs(diff).toFixed(1)+'건'; gCl='gpos'; }
      else { gTx=diff.toFixed(1)+'건'; gCl='gneg'; }
    }

    const bonus=getSYBonus(hw,syLv), payAmt=bonus>0?hw*bonus:0;
    tPay+=payAmt;
    let payTx='-', payCl='no-pay-cell';
    if(hasInput){
      if(payAmt>0){ payTx=Math.round(payAmt*10000).toLocaleString()+'원'; payCl='pay-cell'; }
      else if(hw>=7&&syLv===0){ payTx='생산율미달'; }
      else { payTx='건수미달'; }
    }

    const row=document.getElementById('sy-row-'+i);
    if(row){
      setCell(row.cells[5],syCl,syTx);
      setCell(row.cells[6],hwCl,hwTx);
      setCell(row.cells[7],gCl,gTx);
      setCell(row.cells[8],payCl,payTx);
    }
  });

  const tPayStr=tPay>0?Math.round(tPay*10000).toLocaleString()+'원':'-';
  document.getElementById('sy-tfoot').innerHTML=
    '<tr class="total-row">'+
    '<td class="name">팀합계</td>'+
    '<td style="color:var(--purple);font-weight:700;">'+tM+'</td>'+
    '<td>'+tN+'</td><td>'+tR+'</td><td>'+tS+'</td>'+
    '<td></td><td></td><td></td>'+
    '<td class="'+(tPay>0?'pay-cell':'no-pay-cell')+'">'+tPayStr+'</td>'+
    '</tr>';
}

function setCell(cell,cls,text){ if(!cell)return; cell.className=cls; cell.textContent=text; }

/* ── 생산율 테이블 렌더 ── */
function renderSY(){
  let html='';
  members.forEach(function(name,i){
    const d=dbData[i]||mkD();
    html+='<tr id="sy-row-'+i+'">'+
      '<td class="name">'+escHtml(name)+'</td>'+
      '<td>'+mkInp(i,'mgmt',d.mgmt,'m','sy')+'</td>'+
      '<td>'+mkInp(i,'n',d.n,'','sy')+'</td>'+
      '<td>'+mkInp(i,'r',d.r,'r','sy')+'</td>'+
      '<td>'+mkInp(i,'s',d.s,'s','sy')+'</td>'+
      '<td class="dash">-</td><td class="dash">-</td><td class="dash">-</td><td class="dash">-</td>'+
      '</tr>';
  });
  document.getElementById('sy-tbody').innerHTML=html;
  updateSYResults();
}

/* ── 3.6.9 결과 갱신 ── */
function update369Results(){
  let tN=0,tR=0,tS=0;
  members.forEach(function(_,i){
    const d=dbData[i];
    if(!d) return;
    const n=d.n||0,r=d.r||0,s=d.s||0;
    const hw=calcHW(n,r,s), tot=n+r+s;
    const price=p369Price(hw), amt=price>0?hw*price:0;
    tN+=n; tR+=r; tS+=s;
    const row=document.getElementById('p369-row-'+i);
    if(row){
      setCell(row.cells[4], tot?'nb':'dash', tot?hw.toFixed(1):'-');
      setCell(row.cells[5], price>0?'pay':'dash', price>0?price.toFixed(1)+'만':'-');
      const ac=row.cells[6];
      if(ac){ ac.className=amt>0?'pay-cell':'no-pay-cell'; ac.style.fontWeight='700'; ac.style.fontSize='11px'; ac.textContent=amt>0?amt.toFixed(1)+'만':'-'; }
    }
  });
  const tHW=calcHW(tN,tR,tS), tPrice=p369Price(tHW), tAmt=tPrice>0?tHW*tPrice:0;
  document.getElementById('p369-tfoot').innerHTML=
    '<tr class="total-row">'+
    '<td class="name">팀합계</td>'+
    '<td>'+tN+'</td><td>'+tR+'</td><td>'+tS+'</td>'+
    '<td></td><td></td>'+
    '<td class="'+(tAmt>0?'pay-cell':'no-pay-cell')+'" style="font-weight:700;">'+(tAmt>0?tAmt.toFixed(1)+'만':'-')+'</td>'+
    '</tr>';
}

/* ── 3.6.9 테이블 렌더 ── */
function render369(){
  let html='';
  members.forEach(function(name,i){
    const d=dbData[i]||mkD();
    html+='<tr id="p369-row-'+i+'">'+
      '<td class="name">'+escHtml(name)+'</td>'+
      '<td>'+mkInp(i,'n',d.n,'','369')+'</td>'+
      '<td>'+mkInp(i,'r',d.r,'r','369')+'</td>'+
      '<td>'+mkInp(i,'s',d.s,'s','369')+'</td>'+
      '<td class="dash">-</td><td class="dash">-</td><td class="dash">-</td>'+
      '</tr>';
  });
  document.getElementById('p369-tbody').innerHTML=html;
  update369Results();
}

/* ── 입력 헬퍼 ── */
function mkInp(i,field,val,cls,tab){
  const c='n-inp'+(cls?' '+cls:'');
  const v=(val&&val!==0)?val:'';
  return '<input class="'+c+'" type="number" min="0" inputmode="numeric" '+
    'value="'+v+'" placeholder="0" '+
    'oninput="updDB('+i+',\''+field+'\',this.value,\''+tab+'\')" '+
    'onblur="updDB('+i+',\''+field+'\',this.value,\''+tab+'\')" '+
    'onfocus="this.select()"/>';
}

function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ── 직원 관리 패널 ── */
function togglePanel(){
  const p=document.getElementById('member-panel');
  if(p.classList.contains('hidden')){
    buildEditList();
    p.classList.remove('hidden');
    setTimeout(function(){ p.scrollIntoView({behavior:'smooth',block:'nearest'}); },100);
  } else {
    p.classList.add('hidden');
  }
}

function buildEditList(){
  const list=document.getElementById('edit-list');
  list.innerHTML='';
  members.forEach(function(name,i){
    const div=document.createElement('div');
    div.className='edit-row';
    div.innerHTML=
      '<span class="edit-idx">'+(i+1)+'</span>'+
      '<input class="name-inp" type="text" value="'+escHtml(name)+'" data-idx="'+i+'"/>'+
      '<button class="btn-del" onclick="delMember('+i+')">삭제</button>';
    list.appendChild(div);
  });
  document.getElementById('new-name-inp').value='';
}

function addMember(){
  const inp=document.getElementById('new-name-inp');
  const name=inp.value.trim();
  if(!name) return;
  members.push(name);
  dbData.push(mkD());
  inp.value='';
  buildEditList();
}

function delMember(idx){
  if(members.length<=1){ alert('최소 1명은 있어야 합니다.'); return; }
  members.splice(idx,1);
  dbData.splice(idx,1);
  _lastUpd={};
  buildEditList();
}

/* ── 저장 버튼: 직원명 변경 + localStorage 저장 ── */
function savePanel(){
  document.querySelectorAll('#edit-list .name-inp').forEach(function(inp,i){
    const v=inp.value.trim();
    if(v && i<members.length) members[i]=v;
  });
  _lastUpd={};
  document.getElementById('member-panel').classList.add('hidden');
  /* ★ localStorage 저장 */
  saveData();
  renderSY();
  render369();
}

/* ── 탭 전환 ── */
function showTab(tab){
  document.getElementById('view-sy').classList.toggle('hidden', tab!=='sy');
  document.getElementById('view-369').classList.toggle('hidden', tab!=='369');
  document.getElementById('tab-sy').classList.toggle('active', tab==='sy');
  document.getElementById('tab-369').classList.toggle('active', tab==='369');
  if(tab==='369') render369();
}

/* ── 초기화 ── */
loadData();
renderSY();

<script>
const LS='jump_cody_v3';
(function(){
  const d=new Date();
  document.getElementById('today-date').textContent=
    d.getFullYear()+'.'+(d.getMonth()+1).toString().padStart(2,'0')+'.'+d.getDate().toString().padStart(2,'0');
})();
document.addEventListener('touchstart',function(){
  const m=document.querySelector('meta[name=viewport]');
  if(m)m.content='width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no';
},{passive:true});
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},1800);
}
function saveAll(){
  const data={
    name:document.getElementById('name-field').value.trim(),
    mgmt:document.getElementById('inp-mgmt').value,
    thr:document.getElementById('thr-sy').value,
    n:document.getElementById('inp-n').value,
    r:document.getElementById('inp-r').value,
    s:document.getElementById('inp-s').value,
    n2:document.getElementById('inp-n2').value,
    r2:document.getElementById('inp-r2').value,
    s2:document.getElementById('inp-s2').value,
  };
  try{localStorage.setItem(LS,JSON.stringify(data));}catch(e){}
}
function loadAll(){
  try{
    const raw=localStorage.getItem(LS);if(!raw)return;
    const d=JSON.parse(raw);
    if(d.name){document.getElementById('name-field').value=d.name;applyName(d.name);}
    if(d.mgmt)document.getElementById('inp-mgmt').value=d.mgmt;
    if(d.thr)document.getElementById('thr-sy').value=d.thr;
    if(d.n)document.getElementById('inp-n').value=d.n;
    if(d.r)document.getElementById('inp-r').value=d.r;
    if(d.s)document.getElementById('inp-s').value=d.s;
    if(d.n2)document.getElementById('inp-n2').value=d.n2;
    if(d.r2)document.getElementById('inp-r2').value=d.r2;
    if(d.s2)document.getElementById('inp-s2').value=d.s2;
  }catch(e){}
}
function backupData(){
  const raw=localStorage.getItem(LS);
  if(!raw){showToast('⚠️ 저장된 데이터가 없습니다');return;}
  const blob=new Blob([raw],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const name=document.getElementById('name-field').value.trim()||'코디';
  a.href=url;a.download='jumpup_'+name+'_백업.json';a.click();
  URL.revokeObjectURL(url);
  showToast('📤 백업 완료');
}
function restoreData(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      localStorage.setItem(LS,JSON.stringify(data));
      loadAll();calcSY();calc369Internal();
      showToast('📥 복구 완료!');
    }catch(err){showToast('⚠️ 파일 오류');}
  };
  reader.readAsText(file);input.value='';
}
function applyName(name){
  document.getElementById('hdr-name').textContent=name?name+' 코디':'';
}
function saveName(){
  const name=document.getElementById('name-field').value.trim();
  if(!name){alert('이름을 입력하세요.');return;}
  applyName(name);saveAll();showToast('👤 '+name+' 저장됨');
}
function si(id){const v=parseInt(document.getElementById(id).value,10);return(isNaN(v)||v<0)?0:v;}
function sf(id){const v=parseFloat(document.getElementById(id).value);return(isNaN(v)||v<0)?0:v;}
function calcHW(n,r,s){return n+r*0.5+s;}
function getSYLv(sy){return sy>=7?3:sy>=5?2:sy>=3?1:0;}
function getSYBonus(hw,lv){if(hw<7)return 0;return{1:2.0,2:3.5,3:4.5}[lv]||0;}
function p369Price(h){if(h>=20)return 5;if(h>=15)return 4.5;if(h>=11)return 3.9;if(h>=7)return 3.3;if(h>=4)return 2.7;return 0;}
function setText(id,text,cls){const el=document.getElementById(id);if(!el)return;el.textContent=text;el.className='result-val '+(cls||'');}
function calcSY(){
  const mgmt=si('inp-mgmt'),n=si('inp-n'),r=si('inp-r'),s=si('inp-s');
  const thr=sf('thr-sy')||3;
  const hw=calcHW(n,r,s);const hasInput=(n||r||s);
  document.getElementById('inp-n2').value=n||'';
  document.getElementById('inp-r2').value=r||'';
  document.getElementById('inp-s2').value=s||'';
  setText('res-hw',hasInput?hw.toFixed(1)+'건':'-','v-blue');
  if(mgmt&&hasInput){
    const sy=hw/mgmt*100;const syLv=getSYLv(sy);
    const clr=syLv>=3?'v-green':syLv>=2?'v-blue':syLv>=1?'v-orange':'v-red';
    setText('res-sy',sy.toFixed(2)+'%',clr);
    const diff=(mgmt*(thr/100))-hw;
    if(diff<=0){setText('res-short','+'+Math.abs(diff).toFixed(1)+'건 초과','v-green');}
    else{setText('res-short',diff.toFixed(1)+'건 부족','v-red');}
    const bonus=getSYBonus(hw,syLv);const payAmt=bonus>0?hw*bonus:0;
    if(payAmt>0){setText('res-pay',Math.round(payAmt*10000).toLocaleString()+'원','v-green');}
    else if(hw>=7&&syLv===0){setText('res-pay','생산율 미달','v-gray');}
    else{setText('res-pay','건수 미달 (7건↑)','v-gray');}
  }else{
    setText('res-sy',mgmt?'-':'관리계정 입력 필요',mgmt?'v-gray':'v-red');
    setText('res-short','-','v-gray');setText('res-pay','-','v-gray');
  }
  calc369Internal();saveAll();
}
function calc369Internal(){
  const n=si('inp-n2'),r=si('inp-r2'),s=si('inp-s2');
  const hw=calcHW(n,r,s);const hasInput=(n||r||s);
  setText('res2-hw',hasInput?hw.toFixed(1)+'건':'-','v-blue');
  if(hasInput){
    const price=p369Price(hw);const amt=price>0?hw*price:0;
    setText('res2-price',price>0?price.toFixed(1)+'만원/건':'미지급',price>0?'v-orange':'v-gray');
    setText('res2-amt',amt>0?amt.toFixed(1)+'만원':'-',amt>0?'v-green':'v-gray');
  }else{setText('res2-price','-','v-gray');setText('res2-amt','-','v-gray');}
}
function calc369(){
  const n=si('inp-n2'),r=si('inp-r2'),s=si('inp-s2');
  document.getElementById('inp-n').value=n||'';
  document.getElementById('inp-r').value=r||'';
  document.getElementById('inp-s').value=s||'';
  calc369Internal();saveAll();
}
function showTab(tab){
  document.getElementById('view-sy').classList.toggle('hidden',tab!=='sy');
  document.getElementById('view-369').classList.toggle('hidden',tab!=='369');
  document.getElementById('tab-sy').classList.toggle('active',tab==='sy');
  document.getElementById('tab-369').classList.toggle('active',tab==='369');
}
loadAll();calcSY();calc369Internal();
<\/script>
